<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimFlightPro — AntiGravity 3D Engine</title>
    <meta name="description" content="Cinematic 3D flight simulator with Google Maps Photorealistic 3D Tiles, built with BabylonJS and the AntiGravity Engine.">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1628'/%3E%3Cpath d='M32 12 L18 42 L32 36 L46 42 Z' fill='%2306b6d4'/%3E%3Cpath d='M26 40 L32 36 L38 40 L32 52 Z' fill='%233b82f6'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #020810;
            font-family: 'Inter', system-ui, sans-serif;
        }

        #game-canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            touch-action: none;
            outline: none;
        }

        /* ── Loading Screen ───────────────────────────────── */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 60%, #081828 0%, #020810 70%);
            z-index: 9999;
            gap: 32px;
            pointer-events: auto;
        }

        .loading-logo {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            letter-spacing: 0.45em;
            color: rgba(80, 200, 140, 0.5);
            text-transform: uppercase;
            margin-bottom: -20px;
        }

        .loading-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(32px, 6vw, 64px);
            font-weight: 900;
            letter-spacing: 0.12em;
            background: linear-gradient(135deg, #40ffaa 0%, #00ccff 50%, #7b5fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(0, 200, 255, 0.35));
            line-height: 1;
        }

        .loading-subtitle {
            font-size: 13px;
            letter-spacing: 0.28em;
            color: rgba(100, 220, 180, 0.45);
            text-transform: uppercase;
            font-weight: 300;
            margin-top: -16px;
        }

        /* Spinner ring */
        .loading-ring {
            width: 56px; height: 56px;
            position: relative;
        }
        .loading-ring::before, .loading-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }
        .loading-ring::before {
            border: 2px solid rgba(64, 255, 160, 0.12);
        }
        .loading-ring::after {
            border: 2px solid transparent;
            border-top-color: #40ffaa;
            border-right-color: rgba(64, 255, 170, 0.4);
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-status {
            font-size: 11px;
            letter-spacing: 0.2em;
            color: rgba(80, 200, 150, 0.4);
            text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }

        /* Stars background */
        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--d, 3s) ease-in-out infinite;
        }
        @keyframes twinkle {
            0%,100% { opacity: var(--min-op, 0.1); }
            50%      { opacity: var(--max-op, 0.8); }
        }

        #auth-error {
            font-size: 11px;
            color: #ff5555;
            min-height: 16px;
            text-align: center;
            letter-spacing: 0.1em;
        }

        /* ── Debug UI ─────────────────────────────────────── */
        #debug-ui {
            position: fixed;
            top: 10px; right: 10px;
            width: 320px;
            background: rgba(2, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(64, 255, 170, 0.3);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10000;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #debug-ui.minimized {
            transform: translateX(340px);
        }
        #debug-ui header {
            display: flex; justify-content: space-between; align-items: center;
        }
        #debug-ui h3 {
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            color: #40ffaa;
            margin: 0;
        }
        
        .debug-form {
            display: flex; flex-direction: column; gap: 8px;
        }

        .debug-form label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.6);
        }
        .debug-form input {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 6px 8px; border-radius: 4px; font-family: monospace; font-size: 12px;
            width: 100%; outline: none;
        }
        .debug-form input:focus { border-color: #40ffaa; }
        .debug-form .row { display: flex; gap: 8px; }
        .debug-btn {
            background: #40ffaa; color: #020810; border: none; padding: 8px;
            border-radius: 4px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px;
            margin-top: 4px; transition: background 0.2s;
        }
        .debug-btn:hover { background: #00ccff; }

        @media(max-width:768px){
            #debug-ui{display:none!important}
        }

        /* ── Keys Helper Overlay ─────────────────────────── */
        #keys-helper {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 18px;
            align-items: center;
            padding: 10px 18px;
            background: rgba(2, 10, 20, 0.35);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(64, 255, 170, 0.15);
            border-radius: 10px;
            color: rgba(220, 240, 235, 0.55);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #keys-helper.visible { opacity: 1; }
        #keys-helper.hidden  { opacity: 0; }
        #keys-helper .kh-group { display: flex; align-items: center; gap: 6px; }
        #keys-helper .kh-label { color: rgba(125, 249, 200, 0.55); font-size: 9.5px; }
        #keys-helper kbd {
            display: inline-block;
            min-width: 18px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(64, 255, 170, 0.25);
            background: rgba(0, 20, 15, 0.45);
            color: #cdeee0;
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            text-align: center;
        }
        @media(max-width:768px){ #keys-helper{display:none!important} }

    </style>
</head>

<body>
    <!-- Stars layer -->
    <div class="stars" id="stars-bg"></div>

    <!-- Loading overlay -->
    <div id="loading">
        <div class="loading-logo">AntiGravity Engine · 3D</div>
        <div class="loading-title">SIMFLIGHTPRO</div>
        <div class="loading-subtitle">Flight Simulator</div>
        <div class="loading-ring"></div>
        <div class="loading-status" id="loading-status">Initialising renderer…</div>
        <div id="auth-error"></div>
    </div>

    <!-- BabylonJS renders into this canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Keys helper overlay (visible until first input) -->
    <div id="keys-helper" aria-hidden="true">
        <div class="kh-group"><span class="kh-label">Throttle</span><kbd>W</kbd><kbd>S</kbd></div>
        <div class="kh-group"><span class="kh-label">Pitch</span><kbd>&uarr;</kbd><kbd>&darr;</kbd></div>
        <div class="kh-group"><span class="kh-label">Roll</span><kbd>&larr;</kbd><kbd>&rarr;</kbd></div>
        <div class="kh-group"><span class="kh-label">Yaw</span><kbd>Q</kbd><kbd>E</kbd></div>
        <div class="kh-group"><span class="kh-label">Flaps</span><kbd>5</kbd><kbd>6</kbd></div>
        <div class="kh-group"><span class="kh-label">Brake</span><kbd>B</kbd></div>
        <div class="kh-group"><span class="kh-label">Gear</span><kbd>G</kbd></div>
        <div class="kh-group"><span class="kh-label">Respawn</span><kbd>R</kbd></div>
    </div>

    <!-- Debug UI Panel -->
    <div id="debug-ui" class="minimized">
        <header>
            <h3>LOCATION</h3>
        </header>
        <div class="debug-form">
            <label>Search address or airport</label>
            <input type="text" id="dbg-address" placeholder="e.g. Guarulhos Airport, São Paulo">
            <div id="dbg-geocode-status" style="font-size:9px;color:rgba(255,255,255,0.4);min-height:14px"></div>
            <div class="row">
                <div style="flex:1">
                    <label>Latitude</label>
                    <input type="text" id="dbg-lat" value="-23.4354" placeholder="-23.4354">
                </div>
                <div style="flex:1">
                    <label>Longitude</label>
                    <input type="text" id="dbg-lng" value="-46.4745" placeholder="-46.4745">
                </div>
            </div>
            
            <button class="debug-btn" id="dbg-reload">Apply & Reload World</button>
        </div>

        <div style="border-top:1px solid rgba(64,255,170,.15);margin-top:12px;padding-top:12px">
            <header style="cursor:pointer;user-select:none" id="gfx-header">
                <h3 style="font-family:'Orbitron',monospace;font-size:12px;color:#40ffaa;margin:0">GRAPHICS ▾</h3>
            </header>
            <div id="gfx-settings" class="debug-form" style="margin-top:8px">
                <label>Quality Preset</label>
                <select id="gfx-preset" style="background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;padding:6px 8px;border-radius:4px;font-family:monospace;font-size:12px;width:100%;outline:none">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high" selected>High</option>
                    <option value="ultra">Ultra</option>
                </select>

                <div class="row" style="align-items:center;gap:8px;margin-top:4px">
                    <label style="flex:1;margin:0">Bloom</label>
                    <input type="checkbox" id="gfx-bloom" checked>
                </div>
                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0;font-size:9px;color:rgba(255,255,255,.4)">Weight</label>
                    <input type="range" id="gfx-bloom-weight" min="0" max="100" value="40" style="width:100px">
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">SSAO</label>
                    <input type="checkbox" id="gfx-ssao" checked>
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">Shadows</label>
                    <input type="checkbox" id="gfx-shadows" checked>
                </div>
                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0;font-size:9px;color:rgba(255,255,255,.4)">Quality</label>
                    <select id="gfx-shadow-quality" style="background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;padding:4px 6px;border-radius:4px;font-family:monospace;font-size:10px;outline:none">
                        <option value="1024">Low</option>
                        <option value="2048">Medium</option>
                        <option value="4096" selected>High</option>
                    </select>
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">Fog</label>
                    <input type="checkbox" id="gfx-fog" checked>
                </div>
                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0;font-size:9px;color:rgba(255,255,255,.4)">Density</label>
                    <input type="range" id="gfx-fog-density" min="0" max="100" value="30" style="width:100px">
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">Anti-Aliasing</label>
                    <select id="gfx-aa" style="background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;padding:4px 6px;border-radius:4px;font-family:monospace;font-size:10px;outline:none">
                        <option value="1">Off</option>
                        <option value="2">2x</option>
                        <option value="4" selected>4x</option>
                        <option value="8">8x</option>
                    </select>
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">Vignette</label>
                    <input type="checkbox" id="gfx-vignette" checked>
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">Chromatic Aberration</label>
                    <input type="checkbox" id="gfx-chromatic" checked>
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">Render Scale</label>
                    <input type="range" id="gfx-render-scale" min="50" max="200" value="100" style="width:80px">
                    <span id="gfx-render-scale-val" style="font-size:10px;color:#40ffaa;min-width:30px">1.0x</span>
                </div>

                <div class="row" style="align-items:center;gap:8px">
                    <label style="flex:1;margin:0">FPS Limit</label>
                    <select id="gfx-fps-limit" style="background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;padding:4px 6px;border-radius:4px;font-family:monospace;font-size:10px;outline:none">
                        <option value="30">30</option>
                        <option value="60">60</option>
                        <option value="120">120</option>
                        <option value="0" selected>Unlimited</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Our bundled flight game -->
    <script>
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'flight-main.js?v=' + Date.now();
      document.head.appendChild(s);
    </script>

    <script>
        // --- Debug UI Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        
        const latInput = document.getElementById('dbg-lat');
        const lngInput = document.getElementById('dbg-lng');
        const addressInput = document.getElementById('dbg-address');
        const geocodeStatus = document.getElementById('dbg-geocode-status');
        
        if (urlParams.has('lat')) latInput.value = urlParams.get('lat');
        if (urlParams.has('lng')) lngInput.value = urlParams.get('lng');

        let geocodeTimer = null;
        addressInput.addEventListener('input', () => {
            clearTimeout(geocodeTimer);
            const q = addressInput.value.trim();
            if (q.length < 3) { geocodeStatus.textContent = ''; return; }
            geocodeStatus.textContent = 'Searching...';
            geocodeTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
                    const data = await res.json();
                    if (data.length > 0) {
                        latInput.value = parseFloat(data[0].lat).toFixed(4);
                        lngInput.value = parseFloat(data[0].lon).toFixed(4);
                        geocodeStatus.textContent = data[0].display_name.substring(0, 60);
                    } else {
                        geocodeStatus.textContent = 'No results found';
                    }
                } catch (e) {
                    geocodeStatus.textContent = 'Search error';
                }
            }, 600);
        });

        document.getElementById('dbg-reload').addEventListener('click', () => {
            const dest = new URL(window.location.href);
            dest.searchParams.set('lat', latInput.value.trim());
            dest.searchParams.set('lng', lngInput.value.trim());
            window.location.href = dest.toString();
        });

        // --- Graphics settings collapse toggle ---
        const gfxHeader = document.getElementById('gfx-header');
        const gfxSettings = document.getElementById('gfx-settings');
        if (gfxHeader && gfxSettings) {
            gfxHeader.addEventListener('click', () => {
                const hidden = gfxSettings.style.display === 'none';
                gfxSettings.style.display = hidden ? '' : 'none';
                gfxHeader.querySelector('h3').textContent = hidden ? 'GRAPHICS ▾' : 'GRAPHICS ▸';
            });
        }

        // --- Animated starfield for loading screen ---
        const stars = document.getElementById('stars-bg');
        for (let i = 0; i < 160; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 0.5;
            s.style.cssText = [
                `width:${size}px`, `height:${size}px`,
                `left:${Math.random() * 100}%`, `top:${Math.random() * 100}%`,
                `--d:${(Math.random() * 4 + 1.5).toFixed(1)}s`,
                `--min-op:${(Math.random() * 0.1).toFixed(2)}`,
                `--max-op:${(Math.random() * 0.6 + 0.3).toFixed(2)}`,
                `animation-delay:${(Math.random() * 4).toFixed(1)}s`,
            ].join(';');
            stars.appendChild(s);
        }

        // Loading status messages
        const statuses = [
            'Initialising renderer…',
            'Loading BabylonJS engine…',
            'Building terrain…',
            'Spawning atmosphere…',
            'Calibrating flight controls…',
            'Awaiting clearance for takeoff…',
        ];
        let idx = 0;
        const statusEl = document.getElementById('loading-status');
        const statusInterval = setInterval(() => {
            idx = (idx + 1) % statuses.length;
            statusEl.textContent = statuses[idx];
        }, 900);
        window.__loadingStatusInterval = statusInterval;

        // --- Keys helper: show after loading, hide on first gameplay key, toggle with H ---
        const keysHelper = document.getElementById('keys-helper');
        const loadingNode = document.getElementById('loading');
        let keysHelperDismissed = false;

        const showKeysHelper = () => {
            if (!keysHelper) return;
            keysHelper.classList.remove('hidden');
            keysHelper.classList.add('visible');
        };
        const hideKeysHelper = () => {
            if (!keysHelper) return;
            keysHelper.classList.remove('visible');
            keysHelper.classList.add('hidden');
        };
        const toggleKeysHelper = () => {
            if (!keysHelper) return;
            if (keysHelper.classList.contains('visible')) {
                hideKeysHelper();
            } else {
                showKeysHelper();
            }
        };

        const GAMEPLAY_KEYS = new Set([
            'KeyW','KeyS','KeyA','KeyD','KeyQ','KeyE','KeyR','KeyB',
            'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
            'Digit5','Digit6'
        ]);
        const onFirstInput = (e) => {
            if (!GAMEPLAY_KEYS.has(e.code)) return;
            keysHelperDismissed = true;
            window.removeEventListener('keydown', onFirstInput, true);
            hideKeysHelper();
        };
        window.addEventListener('keydown', onFirstInput, true);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyH' && !e.shiftKey && !e.ctrlKey && !e.altKey) {
                toggleKeysHelper();
            }
        });

        if (loadingNode && loadingNode.parentNode) {
            const obs = new MutationObserver(() => {
                if (!document.getElementById('loading')) {
                    if (!keysHelperDismissed) showKeysHelper();
                    obs.disconnect();
                }
            });
            obs.observe(loadingNode.parentNode, { childList: true });
        } else {
            if (!keysHelperDismissed) showKeysHelper();
        }
        setTimeout(() => {
            if (!document.getElementById('loading') && !keysHelperDismissed) showKeysHelper();
        }, 22000);
    </script>
</body>

</html>
